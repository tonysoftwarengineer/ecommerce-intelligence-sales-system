name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU-only torch, matching Dockerfile.api: the app never uses a GPU, and
      # PyPI's Linux wheel pulls several GB of NVIDIA libraries.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "$(grep '^torch==' constraints.txt)"

      - run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy .

      - name: Backend tests
        run: pytest -q

      # Report-only: surfaces vulnerable pins without blocking the build,
      # since this repo deliberately exact-pins dependencies and a fix may
      # need a coordinated version bump rather than an urgent block. Audits
      # constraints.txt, i.e. the exact locked versions CI and Docker install.
      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r constraints.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Report-only, same rationale as the backend's pip-audit step.
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # CPU-only torch, matching Dockerfile.api: the app never uses a GPU, and
      # PyPI's Linux wheel pulls several GB of NVIDIA libraries.
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "$(grep '^torch==' constraints.txt)"

      - run: pip install -r requirements.txt -c constraints.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # playwright.config.ts starts both the API (fake RAG provider, tfidf
      # retrieval backend) and the Vite dev server itself, so no real
      # GEMINI_API_KEY or embedding-model download is needed here.
      - name: Browser journey
        run: npm run test:e2e
        working-directory: frontend

  # Builds the production image exactly as Dockerfile.api defines it and checks
  # that it actually starts. Without this, a broken Dockerfile would only be
  # discovered at deploy time.
  docker:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f Dockerfile.api -t ei-api:ci .

      - name: Start container
        run: |
          docker run -d --name ei-api -p 8000:8000 \
            -e RAG_RETRIEVAL_BACKEND=tfidf -e RAG_ANSWER_PROVIDER=fake ei-api:ci

      # Startup no longer downloads data, so this normally answers within seconds.
      # The five-minute ceiling only guards against a slow CI runner.
      - name: Wait for the health endpoint
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health; then
              echo; echo "healthy after attempt $attempt"; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' ei-api)" != "true" ]; then
              echo "container exited"; docker logs ei-api; exit 1
            fi
            sleep 5
          done
          echo "health endpoint never answered"; docker logs ei-api; exit 1

      - name: Confirm the process does not run as root
        run: test "$(docker exec ei-api id -u)" != "0"

      - name: Container logs
        if: always()
        run: docker logs ei-api || true
