name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy .

      # Integration tests build the real dataset (downloads ~43MB from
      # Kaggle); they run in the separate `integration` job below so a fast
      # lint/type/unit failure here doesn't waste that download.
      - name: Unit tests
        run: pytest -q -m "not integration"

      # Report-only: surfaces vulnerable pins without blocking the build,
      # since this repo deliberately exact-pins dependencies and a fix may
      # need a coordinated version bump rather than an urgent block.
      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true

  integration:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - run: pip install -r requirements.txt

      # Builds the real Olist dataset via kagglehub's anonymous fetch
      # (~43MB download, no credentials needed).
      - name: Integration tests
        run: pytest -q -m integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # Report-only, same rationale as the backend's pip-audit step.
      - name: Dependency vulnerability scan
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # playwright.config.ts starts both the API (fake RAG provider, tfidf
      # retrieval backend) and the Vite dev server itself, so no real
      # GEMINI_API_KEY or embedding-model download is needed here.
      - name: Browser journey
        run: npm run test:e2e
        working-directory: frontend
